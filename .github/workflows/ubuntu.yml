name: Ubuntu Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 20.04 is the minimum supported version;
        # 24.04 is kept alongside it to catch regressions on newer toolchains.
        os: [ubuntu-20.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout cdx_coverage
        uses: actions/checkout@v4
        with:
          path: cdx_coverage
          submodules: recursive
          fetch-depth: 0

      # cdx_lib is neither a Git submodule nor a sibling checkout: CMake's
      # FetchContent fetches and builds it automatically during the
      # "Configure" step below (see CMakeLists.txt), same as GoogleTest.
      # Single source of truth for system packages, CLI11, GCC-11 (20.04
      # only) and Abseil - see scripts/install_ubuntu20.sh.
      - name: Bootstrap build dependencies (scripts/install_ubuntu20.sh)
        run: |
          # Sourced (not executed) so the CC/CXX it exports survive past
          # this step, and forwarded into GITHUB_ENV for later steps.
          source ./scripts/install_ubuntu20.sh
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
        working-directory: cdx_coverage

      - name: Show toolchain versions
        run: |
          ${CXX:-g++} --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: cdx_coverage

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"
        working-directory: cdx_coverage

      - name: Smoke test
        run: |
          ./build/cdx_coverage --help
        working-directory: cdx_coverage
