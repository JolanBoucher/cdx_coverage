name: Ubuntu Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 20.04 is the minimum supported version;
        # 24.04 is kept alongside it to catch regressions on newer toolchains.
        os: [ubuntu-20.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      # Checked out into its own subdirectory (not the workspace root) so
      # that cdx_lib below can be checked out as a true sibling directory.
      - name: Checkout cdx_coverage
        uses: actions/checkout@v4
        with:
          path: cdx_coverage
          submodules: recursive
          fetch-depth: 0

      # cdx_lib is not a Git submodule of this repo: CMakeLists.txt expects
      # it checked out as a sibling directory, `../cdx_lib` relative to
      # cdx_coverage (see README > Requirements > Build-time dependencies).
      - name: Checkout cdx_lib (sibling checkout)
        uses: actions/checkout@v4
        with:
          repository: JolanBoucher/cdx_lib
          path: cdx_lib

      # Single source of truth for system packages, CLI11, GCC-11 (20.04
      # only) and Abseil - see scripts/install_ubuntu20.sh. It also
      # re-clones cdx_lib if missing, but that's a no-op here since it was
      # already checked out above as a sibling directory.
      - name: Bootstrap build dependencies (scripts/install_ubuntu20.sh)
        run: |
          # Sourced (not executed) so the CC/CXX it exports survive past
          # this step, and forwarded into GITHUB_ENV for later steps.
          source ./scripts/install_ubuntu20.sh
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
        working-directory: cdx_coverage

      - name: Show toolchain versions
        run: |
          ${CXX:-g++} --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: cdx_coverage

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"
        working-directory: cdx_coverage

      - name: Smoke test
        run: |
          ./build/cdx_coverage --help
        working-directory: cdx_coverage
